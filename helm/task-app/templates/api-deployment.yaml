apiVersion: apps/v1
kind: Deployment

metadata:
  name: task-api

spec:
  replicas: {{ .Values.api.replicas }}

  selector:
    matchLabels:
      app: task-api

  template:
    metadata:
      labels:
        app: task-api

    spec:
      containers:
        - name: task-api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"

          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: task-api-config

          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: task-api-secret
                  key: API_KEY

          resources:
            requests:
              cpu: {{ .Values.api.resources.requests.cpu }}
              memory: {{ .Values.api.resources.requests.memory }}
            limits:
              cpu: {{ .Values.api.resources.limits.cpu }}
              memory: {{ .Values.api.resources.limits.memory }}

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
